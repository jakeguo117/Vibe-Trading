# A股战法12（CCI月线）每日纸面订单表。纸面交易，不连券商、不下单。
# 主触发：外部调用 workflow_dispatch（约北京时间 08:30，交易日）；备用：cron 08:30 北京时间（UTC 00:30，周一至周五）。
# 状态（纸面账户、发送标记）与日线缓存通过 actions/cache 在运行之间保存，绝不提交到仓库。
# 首次全历史若超过本任务时限，已写入的 parquet 会保存，下次接着补；也可先跑 ashare-tactic12-build-cache（6 小时）。
name: ashare-tactic12-daily

on:
  workflow_dispatch:
    inputs:
      today:
        description: "覆盖日期 YYYY-MM-DD（留空=北京时间今天）"
        required: false
        default: ""
      dry_run:
        description: "演练：生成订单表但不发邮件"
        type: boolean
        default: false
  schedule:
    - cron: "30 0 * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  group: ashare-tactic12-daily
  cancel-in-progress: false

jobs:
  order-sheet:
    if: github.repository == 'jakeguo117/Vibe-Trading'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      STATE_DIR: ${{ github.workspace }}/.t12/state
      CACHE_DIR: ${{ github.workspace }}/.t12/cache
      QUIET_SHEET: "1"
      FETCH_WORKERS: "4"
      FETCH_MIN_INTERVAL: "0.05"
      # 在任务超时前停手，把已完成的缓存留给下一步保存
      FETCH_BUDGET_SEC: "2400"
      MIN_COVERAGE: "0.85"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/ashare_tactic12_daily/requirements.txt
      - run: pip install -r research/ashare_tactic12_daily/requirements.txt

      - name: Resolve date
        id: d
        run: |
          T="${{ inputs.today }}"; [ -n "$T" ] || T="$(date +%F)"
          echo "today=$T" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        run: mkdir -p .t12/state/sheets .t12/cache/bars

      - name: Restore state + bar cache
        uses: actions/cache/restore@v4
        with:
          path: .t12
          key: t12-${{ github.run_id }}
          restore-keys: t12-

      - name: Unit tests
        working-directory: research
        run: python -m pytest -q ashare_tactics/test_logic.py ashare_tactic12_daily

      - name: Build order sheet + email
        id: run
        timeout-minutes: 50
        working-directory: research/ashare_tactic12_daily
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: ./run_daily.sh --today "${{ steps.d.outputs.today }}"

      # 无论成功失败都保存，首次建缓存若超时，下次接着补
      - name: Save state + bar cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .t12
          key: t12-${{ github.run_id }}

      - name: Upload order sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-sheet-${{ steps.d.outputs.today }}
          path: .t12/state/sheets/order_sheet_${{ steps.d.outputs.today }}.txt
          if-no-files-found: ignore
          retention-days: 7
